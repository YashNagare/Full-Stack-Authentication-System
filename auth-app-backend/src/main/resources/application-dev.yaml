server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_app
    username: postgres
    password: root
  hikari:
    pool-name: HikariCP
    maximum-pool-size: 10
    minimum-idle: 5
    idle-timeout: 30000
    max-lifetime: 1800000
    connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect